services:
  # 1. Main ARPG Game Application & Tactical Deck Interface
  neural-overload:
    image: montreal-2033-neural-overload:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: montreal-2033-arpg
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - montreal-2033-mesh
    labels:
      - "app=montreal-2033-neural-overload"
      - "version=1.2-cyber-deck-fusion"

  # Dev mode: hot-reload with mounted source
  neural-overload-dev:
    image: node:20-alpine
    container_name: montreal-2033-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - montreal-2033-mesh
    environment:
      - NODE_ENV=development
    profiles:
      - dev

networks:
  montreal-2033-mesh:
    driver: bridge
